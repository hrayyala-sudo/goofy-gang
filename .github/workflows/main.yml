name: Keep Streamlit Awake

on:
  schedule:
    # Runs twice a day (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # Replace with your actual Goofy Gang app URL
          curl -s -f https://goofy-gang.streamlit.app/ > /dev/null || echo "Ping failed, but continuing..."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Keep Alive Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Chore: Keep-alive trigger"
          git push
